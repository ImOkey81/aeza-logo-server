spring:
  application:
    name: aeza-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logovizor}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8087

security:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}

auth:
  token:
    secret: ${JWT_SECRET:dev-secret}
    ttl-seconds: 86400

agent:
  shared-token: ${AGENT_SHARED_TOKEN:agent-secret}

alert:
  scheduler:
    interval-ms: ${ALERT_SCHEDULER_INTERVAL_MS:30000}

integration:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  webhook:
    url: ${ALERT_WEBHOOK_URL:}
